# /etc/nginx/sites-available/cip — REFERÊNCIA para instalação nova.
# No servidor atual o arquivo já tem o bloco HTTPS do Certbot: NÃO substitua,
# altere só client_max_body_size e os timeouts.
server {
    listen 80;
    listen [::]:80;
    server_name cip.sistemagip.tech;

    client_max_body_size 400M;      # arquivo mensal da Enel

    location /static/ {
        alias /opt/cip/static/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:5002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;    # processamento e Excel da análise
        proxy_send_timeout 600s;
    }
}
